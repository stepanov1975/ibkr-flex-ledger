# Publish the release's existing Dockerfile after checking startup and migrations.
name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: release_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d release_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Validate the published release
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.draft == false and .prerelease == false' | grep -qx true
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Build the release image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "$IMAGE:$RELEASE_TAG" .

      - name: Check database migrations and application health
        run: |
          docker run --detach --name release-smoke --network host \
            --env DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/release_smoke \
            --env IBKR_FLEX_TOKEN=release-smoke --env IBKR_FLEX_QUERY_ID=release-smoke \
            "$IMAGE:$RELEASE_TAG"
          trap 'docker logs release-smoke; docker rm --force release-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Publish and verify the image
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker push "$IMAGE:$RELEASE_TAG"
          docker pull "$IMAGE:$RELEASE_TAG"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" == "$RELEASE_TAG" ]]; then
            docker tag "$IMAGE:$RELEASE_TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          digest=$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{index .RepoDigests 0}}')
          {
            echo "Published \`$IMAGE:$RELEASE_TAG\` for linux/amd64."
            echo
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
