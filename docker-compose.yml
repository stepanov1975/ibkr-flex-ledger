services:
  postgres:
    image: postgres:17
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/lib/postgresql/wal_archive /backups
        chown -R postgres:postgres /var/lib/postgresql/wal_archive /backups
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
      - -c
      - archive_timeout=300
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - postgres_backups:/backups

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME}
      APPLICATION_HOST: ${APPLICATION_HOST}
      APPLICATION_PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ACCOUNT_ID: ${ACCOUNT_ID:-DEFAULT_ACCOUNT}
      IBKR_FLEX_TOKEN: ${IBKR_FLEX_TOKEN}
      IBKR_FLEX_QUERY_ID: ${IBKR_FLEX_QUERY_ID}
      API_DEFAULT_LIMIT: ${API_DEFAULT_LIMIT}
      API_MAX_LIMIT: ${API_MAX_LIMIT}
    ports:
      - "${APPLICATION_PORT}:8000"
    volumes:
      - diagnostics_archive:/service/var/diagnostics-archive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  postgres_wal_archive:
  postgres_backups:
  diagnostics_archive:
